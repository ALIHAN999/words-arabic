<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>تعلم العربية — Учим арабский</title>

  <!-- VK Bridge SDK для Mini Apps -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0f0c29;
      --bg-secondary: #302b63;
      --bg-tertiary: #24243e;
      --gold: #f6d365;
      --gold-dark: #d4a017;
      --card-front: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-back: linear-gradient(135deg, #fdf4d4 0%, #f5e1dc 100%);
      --lesson-card-bg: rgba(255, 255, 255, 0.07);
      --lesson-card-hover: rgba(255, 255, 255, 0.14);
      --text-light: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --text-dark: #2d2d2d;
      --success: #00c853;
      --radius: 20px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -30%;
      width: 80vw;
      height: 80vw;
      background: radial-gradient(circle, rgba(246, 211, 101, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -40%;
      left: -20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(102, 126, 234, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .header-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), #fda085);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
    }

    .header .arabic-title {
      font-family: 'Noto Naskh Arabic', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 5px;
      direction: rtl;
      line-height: 1.6;
    }

    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px 0 60px;
    }

    .lesson-card {
      background: var(--lesson-card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius);
      padding: 30px 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .lesson-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), #fda085, #667eea);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .lesson-card:hover {
      background: var(--lesson-card-hover);
      transform: translateY(-5px) scale(1.01);
      box-shadow: var(--shadow);
      border-color: rgba(246, 211, 101, 0.3);
    }

    .lesson-card:hover::before {
      opacity: 1;
    }

    .lesson-card:active {
      transform: scale(0.98);
    }

    .lesson-emoji {
      font-size: 2.8rem;
      margin-bottom: 12px;
      display: block;
    }

    .lesson-number {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .lesson-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .lesson-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lesson-words-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .lesson-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(246, 211, 101, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    .lesson-card:hover .lesson-arrow {
      background: var(--gold);
      color: var(--text-dark);
      transform: translateX(4px);
    }

    .lesson-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
    }

    .lesson-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--success));
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .page {
      display: none;
      animation: fadeInUp 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lesson-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      color: var(--text-light);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-back:active {
      background: rgba(255, 255, 255, 0.25);
    }

    .lesson-progress-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--gold);
    }

    .progress-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(var(--gold) var(--progress, 0%), rgba(255,255,255,0.1) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .progress-circle::after {
      content: '';
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-secondary);
      position: absolute;
    }

    .progress-circle span {
      position: relative;
      z-index: 1;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .lesson-page-title {
      text-align: center;
      padding: 10px 0 24px;
    }

    .lesson-page-title h2 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .lesson-page-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .hint-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding-bottom: 60px;
    }

    .flip-card {
      perspective: 1000px;
      height: 220px;
      cursor: pointer;
      user-select: none;
      opacity: 0;
      animation: cardAppear 0.4s ease forwards;
    }

    /* АНИМАЦИЯ ПОЯВЛЕНИЯ КАРТОЧЕК */
    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .flip-card-front {
      background: var(--card-front);
    }

    .flip-card-front .card-number {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 0.7rem;
      font-weight: 800;
      opacity: 0.5;
      letter-spacing: 1px;
    }

    .flip-card-front .arabic-word {
      font-family: 'Noto Naskh Arabic', serif;
      font-size: 2.6rem;
      font-weight: 600;
      direction: rtl;
      text-align: center;
      line-height: 1.7;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .flip-card-front .tap-hint {
      position: absolute;
      bottom: 14px;
      font-size: 0.7rem;
      opacity: 0.5;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .flip-card-back {
      background: var(--card-back);
      transform: rotateY(180deg);
      color: var(--text-dark);
    }

    .flip-card-back .translation {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .flip-card-back .transcription {
      font-size: 0.9rem;
      opacity: 0.7;
      font-weight: 600;
      font-style: italic;
    }

    .flip-card-back .back-icon {
      position: absolute;
      bottom: 14px;
      font-size: 1.2rem;
      opacity: 0.4;
    }

    .completion-banner {
      display: none;
      text-align: center;
      padding: 36px 20px;
      margin: 20px 0 40px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(246, 211, 101, 0.3);
      border-radius: var(--radius);
      animation: fadeInUp 0.4s ease;
    }

    .completion-banner.show {
      display: block;
    }

    .completion-banner .trophy {
      font-size: 3.5rem;
      margin-bottom: 12px;
      display: block;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .completion-banner h3 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .completion-banner p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .btn-reset {
      margin-top: 20px;
      padding: 12px 32px;
      background: linear-gradient(135deg, var(--gold), #fda085);
      color: var(--text-dark);
      border: none;
      border-radius: 50px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 25px rgba(246, 211, 101, 0.3);
    }

    @media (max-width: 400px) {
      .header h1 { font-size: 1.5rem; }
      .header .arabic-title { font-size: 1.5rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .lessons-grid { grid-template-columns: 1fr; }
      .flip-card { height: 200px; }
      .flip-card-front .arabic-word { font-size: 2.3rem; }
    }

    @media (min-width: 768px) {
      .container { padding: 30px 40px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      .flip-card { height: 230px; }
    }

    @media (min-width: 1024px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
      .lessons-grid { grid-template-columns: repeat(3, 1fr); }
      .flip-card { height: 240px; }
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ГЛАВНАЯ СТРАНИЦА -->
    <div id="page-home" class="page active">
      <header class="header">
        <span class="header-icon">🕌</span>
        <div class="arabic-title">تَعَلَّمِ العَرَبِيَّة</div>
        <h1>Учим арабский язык</h1>
        <p>Выбери урок и начни учить новые слова!</p>
      </header>

      <div class="lessons-grid" id="lessons-grid"></div>
    </div>

    <!-- СТРАНИЦА УРОКА -->
    <div id="page-lesson" class="page">
      <nav class="lesson-nav">
        <button class="btn-back" onclick="goHome()">
          ← Назад к урокам
        </button>
        <div class="lesson-progress-info">
          <div class="progress-circle" id="progress-circle">
            <span id="progress-text">0%</span>
          </div>
          <span id="progress-label">0 / 0</span>
        </div>
      </nav>

      <div class="lesson-page-title">
        <h2 id="lesson-title"></h2>
        <p id="lesson-subtitle"></p>
      </div>

      <p class="hint-text">👆 Нажми на карточку, чтобы увидеть перевод</p>

      <!-- КОНТЕЙНЕР ДЛЯ 3D-КАРТОЧЕК СЛОВ -->
      <div class="cards-grid" id="cards-grid"></div>

      <div class="completion-banner" id="completion-banner">
        <span class="trophy">🏆</span>
        <h3>Отлично!</h3>
        <p>Ты выучил все слова в этом уроке! Так держать! 🌟</p>
        <button class="btn-reset" onclick="resetLesson()">Повторить урок</button>
      </div>
    </div>

  </div>

  <script>
    /* ============================================================
       📝 ДАННЫЕ УРОКОВ
       ============================================================ */
    const lessons = [
      
      {
        title: "Сура аль-Фатиха. Часть 1",
        emoji: "📖",
        desc: "Ключевые слова из первой суры Корана — «Открывающей»",
        words: [
          { ar: "بِـ",       ru: "с / посредством",        tr: "би" },
          { ar: "ٱسْمٌ",      ru: "Имя / Название", tr: "исм(ун)" },
          { ar: "حَمْدٌ",    ru: "Хвала",         tr: "хамд(ун)" },
          { ar: "ٱلْحَمْدُ",    ru: "Вся хвала",         tr: "аль-хамд(у)" },
          { ar: "لِـ", ru: "Предлог принадлежности",         tr: "ли" },
          { ar: "لِلَّهِ", ru: "Принадлежит Аллаху",         tr: "лиЛа́h(и)" },
          { ar: "رَبٌّ",   ru: "Господин / Хозяин / Глава",  tr: "робб(ун)" },
          { ar: "عَالَمٌ",   ru: "Мир / Вселенная / Царство",  tr: "'а́лям(ун)" },
          { ar: "عَالَمُونَ",   ru: "Миры / Вселенные",  tr: "'а́ляму́н(а)" },
          { ar: "ٱلْعَالَمُونَ",   ru: "Все миры",  tr: "аль-'а́ляму́н(а)" },
          { ar: "مَلَكَ", ru: "(Он) Владел",   tr: "маляка" },
          { ar: "يَمْلِكُ",   ru: "(Он) Владеет",  tr: "йамлику" },
          { ar: "مَالِكٌ",        ru: "Тот, кто владеет",       tr: "Ма́лик(ун)" },
          { ar: "يَوْمٌ",       ru: "День",          tr: "йаwм(ун)" },
          { ar: "دِينٌ",     ru: "Воздаяние / Расчёт / Религия",     tr: "ди́н(ун)" }
        ]
      },

      {
        title: "Сура аль-Фатиха",
        emoji: "📖",
        desc: "Ключевые слова из первой суры Корана — «Открывающей»",
        words: [
          { ar: "بِـ",       ru: "с / посредством",        tr: "би" },
          { ar: "ٱسْمٌ",      ru: "Имя / Название", tr: "исм(ун)" },
          { ar: "حَمْدٌ",    ru: "Хвала",         tr: "хамд(ун)" },
          { ar: "ٱلْحَمْدُ",    ru: "Вся хвала",         tr: "аль-хамд(у)" },
          { ar: "لِـ", ru: "Предлог принадлежности",         tr: "ли" },
          { ar: "لِلَّهِ", ru: "Принадлежит Аллаху",         tr: "лиЛа́h(и)" },
          { ar: "رَبٌّ",   ru: "Господин / Хозяин / Глава",  tr: "робб(ун)" },
          { ar: "عَالَمٌ",   ru: "Мир / Вселенная / Царство",  tr: "'а́лям(ун)" },
          { ar: "عَالَمُونَ",   ru: "Миры / Вселенные",  tr: "'а́ляму́н(а)" },
          { ar: "ٱلْعَالَمُونَ",   ru: "Все миры",  tr: "аль-'а́ляму́н(а)" },
          { ar: "مَلَكَ", ru: "(Он) Владел",   tr: "маляка" },
          { ar: "يَمْلِكُ",   ru: "(Он) Владеет",  tr: "йамлику" },
          { ar: "مَالِكٌ",        ru: "Тот, кто владеет",       tr: "Ма́лик(ун)" },
          { ar: "يَوْمٌ",       ru: "День",          tr: "йаwм(ун)" },
          { ar: "دِينٌ",     ru: "Воздаяние / Расчёт / Религия",     tr: "ди́н(ун)" }
        ]
      }

    ];

    /* ============================================================
       ⚙️ ЛОГИКА VK BRIDGE И ОБЛАЧНОГО ХРАНИЛИЩА (БЕЗ ВИБРАЦИИ)
       ============================================================ */
    const bridge = window.vkBridge || (typeof vkBridge !== 'undefined' ? vkBridge : null);

    let currentUserId = 'default';
    let allUserProgress = {};
    let currentLesson = null;
    let flippedCards = new Set();

    // Определение ID пользователя
    function detectUserId() {
      try {
        let params = new URLSearchParams(window.location.search);
        let uid = params.get('vk_user_id');

        if (!uid && window.location.hash) {
          const hash = window.location.hash.substring(1);
          const qIndex = hash.indexOf('?');
          const hashQuery = qIndex !== -1 ? hash.substring(qIndex + 1) : hash;
          params = new URLSearchParams(hashQuery);
          uid = params.get('vk_user_id');
        }

        if (uid) {
          currentUserId = uid;
        }
      } catch (e) {
        console.warn('Ошибка чтения параметров URL:', e);
      }
    }

    // Загрузка сохраненного прогресса
    async function loadAllProgress() {
      const storageKey = 'arabic_all_prog';
      const localKey = `arabic_all_prog_u${currentUserId}`;

      if (bridge) {
        try {
          const res = await bridge.send('VKWebAppStorageGet', { keys: [storageKey] });
          if (res && res.keys && res.keys[0] && res.keys[0].value) {
            allUserProgress = JSON.parse(res.keys[0].value);
            return;
          }
        } catch (e) {
          console.warn('VK Storage недоступен, чтение из LocalStorage:', e);
        }
      }

      try {
        const raw = localStorage.getItem(localKey);
        if (raw) {
          allUserProgress = JSON.parse(raw);
        }
      } catch (e) {
        allUserProgress = {};
      }
    }

    // Сохранение прогресса
    function saveProgress(lessonIndex, flippedSet) {
      allUserProgress[lessonIndex] = [...flippedSet];

      const serialized = JSON.stringify(allUserProgress);
      const storageKey = 'arabic_all_prog';
      const localKey = `arabic_all_prog_u${currentUserId}`;

      try {
        localStorage.setItem(localKey, serialized);
      } catch (e) {}

      if (bridge) {
        bridge.send('VKWebAppStorageSet', {
          key: storageKey,
          value: serialized
        }).catch(err => {
          console.warn('Ошибка сохранения в VK Storage:', err);
        });
      }
    }

    function getLessonProgress(lessonIndex) {
      const arr = allUserProgress[lessonIndex];
      return new Set(Array.isArray(arr) ? arr : []);
    }

    /* ============================================================
       🖥️ РЕНДЕР И ВЗАИМОДЕЙСТВИЕ
       ============================================================ */
    function renderHome() {
      const grid = document.getElementById('lessons-grid');
      grid.innerHTML = '';

      lessons.forEach((lesson, index) => {
        const progress = getLessonProgress(index);
        const percent = Math.round((progress.size / lesson.words.length) * 100);

        const card = document.createElement('div');
        card.className = 'lesson-card';
        card.onclick = () => openLesson(index);

        card.innerHTML = `
          <span class="lesson-emoji">${lesson.emoji}</span>
          <div class="lesson-number">Урок ${index + 1}</div>
          <div class="lesson-title">${lesson.title}</div>
          <div class="lesson-desc">${lesson.desc}</div>
          <div class="lesson-meta">
            <span class="lesson-words-count">${lesson.words.length} слов</span>
            <div class="lesson-arrow">→</div>
          </div>
          <div class="lesson-progress-bar">
            <div class="lesson-progress-fill" style="width: ${percent}%"></div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openLesson(index) {
      currentLesson = index;
      flippedCards = getLessonProgress(index);

      const lesson = lessons[index];
      document.getElementById('lesson-title').textContent = `${lesson.emoji} ${lesson.title}`;
      document.getElementById('lesson-subtitle').textContent = `Урок ${index + 1} — ${lesson.desc}`;

      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      lesson.words.forEach((word, i) => {
        const card = document.createElement('div');
        card.className = 'flip-card';
        card.style.animationDelay = `${i * 0.04}s`;

        if (flippedCards.has(i)) {
          card.classList.add('flipped');
        }

        card.onclick = () => toggleCard(card, i);

        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <span class="card-number">#${i + 1}</span>
              <div class="arabic-word">${word.ar}</div>
              <span class="tap-hint">нажми ↻</span>
            </div>
            <div class="flip-card-back">
              <div class="translation">${word.ru}</div>
              <div class="transcription">${word.tr || ''}</div>
              <span class="back-icon">✅</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      updateProgressUI();

      const banner = document.getElementById('completion-banner');
      if (flippedCards.size === lesson.words.length) {
        banner.classList.add('show');
      } else {
        banner.classList.remove('show');
      }

      showPage('page-lesson');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      window.history.pushState({ page: 'lesson' }, '');
    }

    function toggleCard(card, index) {
      card.classList.toggle('flipped');

      if (card.classList.contains('flipped')) {
        flippedCards.add(index);
      } else {
        flippedCards.delete(index);
      }

      saveProgress(currentLesson, flippedCards);
      updateProgressUI();

      const banner = document.getElementById('completion-banner');
      if (flippedCards.size === lessons[currentLesson].words.length) {
        setTimeout(() => {
          banner.classList.add('show');
          launchConfetti();
        }, 500);
      } else {
        banner.classList.remove('show');
      }
    }

    function updateProgressUI() {
      const total = lessons[currentLesson].words.length;
      const done = flippedCards.size;
      const percent = Math.round((done / total) * 100);

      document.getElementById('progress-text').textContent = `${percent}%`;
      document.getElementById('progress-label').textContent = `${done} / ${total}`;
      document.getElementById('progress-circle').style.setProperty('--progress', `${percent}%`);
    }

    function resetLesson() {
      flippedCards.clear();
      saveProgress(currentLesson, flippedCards);
      document.getElementById('completion-banner').classList.remove('show');
      openLesson(currentLesson);
    }

    function goHome() {
      currentLesson = null;
      showPage('page-home');
      renderHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function launchConfetti() {
      const colors = ['#f6d365', '#fda085', '#667eea', '#764ba2', '#00c853', '#ff5252'];
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.width = (Math.random() * 8 + 6) + 'px';
          piece.style.height = (Math.random() * 8 + 6) + 'px';
          piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 3500);
        }, i * 25);
      }
    }

    window.addEventListener('popstate', () => {
      if (currentLesson !== null) {
        goHome();
      }
    });

    (async function init() {
      detectUserId();

      if (bridge) {
        try {
          await bridge.send('VKWebAppInit');
        } catch (e) {
          console.error('Ошибка VKWebAppInit:', e);
        }
      }

      await loadAllProgress();
      renderHome();
    })();
  </script>
</body>
</html>
